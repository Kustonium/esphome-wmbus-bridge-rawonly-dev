# Compile-only: verifies opt-in RX code generation. Never flash this pin map.
esphome:
  name: cc1101-rx-bench-ci
esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf
external_components:
  - source: github://Kustonium/esphome-wmbus-bridge-rawonly@main
    components: [wmbus_radio]
    refresh: 0s
logger:
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
mqtt:
  broker: !secret mqtt_broker
spi:
  clk_pin: GPIO5
  mosi_pin: GPIO6
  miso_pin: GPIO7
wmbus_radio:
  radio_type: CC1101
  cc1101_allow_experimental: true
  cc1101_rx_state_wait: true
  cc1101_idle_rx_refresh: true
  cs_pin: GPIO4
  gdo0_pin: GPIO3
  gdo2_pin: GPIO2
  listen_mode: t1
