version: 2

# GitHub Actions only. `pip install esphome` in ci.yml is unpinned on purpose
# (CI must see the ESPHome release users get), so there is nothing to bump there.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
